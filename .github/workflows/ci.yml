name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript tests and syntax
        run: |
          node tests/lib.test.js
          node --check extension/background.js
          node --check extension/lib.js
          node --check extension/popup.js
      - name: Python tests and syntax
        run: |
          python -m unittest tests.test_companion -v
          python -m py_compile companion.py oauth_setup.py oauth_listener.py setup.py scripts/doctor.py scripts/package_release.py scripts/secret_scan.py
      - name: Secret safety scan
        run: python scripts/secret_scan.py
      - name: Build public archive
        run: python scripts/package_release.py
